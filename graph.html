<!DOCTYPE html>
<html>
<head>
<title>Price Graph</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h2 style="text-align:center;">📊 Flight Prices</h2>

<canvas id="chart"></canvas>

<script>
const ctx = document.getElementById('chart');

new Chart(ctx, {
    type: 'bar',
    data: {
        labels: {{ labels | tojson }},
        datasets: [{
            label: 'Prices AED',
            data: {{ prices | tojson }}
        }]
    }
});
</script>

</body>
</html>
